<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0d0d;
      --rail-bg:     #111111;
      --border:      #1e1e1e;
      --border-mid:  #2a2a2a;
      --text:        #c8c8c8;
      --text-dim:    #6a6a6a;
      --text-bright: #e8e8e8;
      --accent:      #00ff88;
      --accent-dim:  rgba(0,255,136,0.08);
      --green:       #22c55e;
      --green-dim:   rgba(34,197,94,0.12);
      --row-hover:   #161616;
      --mono:        'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      --display:     'Barlow Condensed', 'Arial Narrow', sans-serif;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      display: flex;
    }

    /* ─── LEFT RAIL ─── */
    #rail {
      width: 200px;
      flex-shrink: 0;
      background: var(--rail-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #rail-title {
      padding: 13px 14px 10px;
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #project-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .project-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      cursor: pointer;
      border-left: 2px solid transparent;
      gap: 8px;
    }

    .project-row:hover { background: #181818; }

    .project-row.active {
      border-left-color: var(--accent);
      background: var(--accent-dim);
    }

    .project-name {
      font-family: var(--display);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .project-row.active .project-name { color: var(--accent); }

    .project-fraction {
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      flex-shrink: 0;
    }

    #new-project-btn {
      margin: 8px 10px;
      padding: 6px 0;
      background: transparent;
      border: 1px solid var(--border-mid);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
    }

    #new-project-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* ─── MAIN CONTENT ─── */
    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── TOP BAR ─── */
    #topbar {
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 44px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
    }

    #active-project-label {
      font-family: var(--display);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-bright);
      letter-spacing: 0.02em;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-btn {
      padding: 5px 10px;
      background: transparent;
      border: 1px solid var(--border-mid);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
    }

    .topbar-btn:hover { color: var(--accent); border-color: var(--accent); }

    .topbar-btn.primary { border-color: rgba(0,255,136,0.4); color: var(--accent); }
    .topbar-btn.primary:hover { background: var(--accent-dim); }

    /* ─── TOTALS STRIP ─── */
    #totals-strip {
      display: flex;
      align-items: center;
      padding: 6px 16px;
      gap: 28px;
      border-bottom: 1px solid var(--border);
      background: #0f0f0f;
      flex-shrink: 0;
    }

    .totals-cell { display: flex; flex-direction: column; gap: 2px; }

    .totals-label {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .totals-value { font-size: 13px; font-weight: 600; }
    .totals-value.neutral { color: var(--text); }
    .totals-value.accent  { color: var(--accent); }
    .totals-value.green   { color: var(--green); }

    /* ─── COLUMN HEADER ─── */
    #item-header {
      display: grid;
      grid-template-columns: 90px 1fr 90px 76px 116px;
      align-items: center;
      padding: 0 16px;
      height: 26px;
      border-bottom: 1px solid var(--border);
      background: #0f0f0f;
      flex-shrink: 0;
    }

    .col-label {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ─── ITEM LIST ─── */
    #item-list { flex: 1; overflow-y: auto; }

    .item-row {
      display: grid;
      grid-template-columns: 90px 1fr 90px 76px 116px;
      align-items: center;
      padding: 0 16px;
      height: 38px;
      border-bottom: 1px solid var(--border);
      opacity: 0;
      transition: background 0.1s, opacity 0.18s ease;
    }

    .item-row.visible { opacity: 1; }
    .item-row:hover { background: var(--row-hover); }

    .retailer-tag {
      font-size: 9px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-dim);
      border: 1px solid var(--border-mid);
      padding: 1px 5px;
      display: inline-block;
      white-space: nowrap;
      max-width: 82px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-title {
      font-size: 12px;
      color: var(--text-bright);
      padding-right: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-row[data-status="dropped"] .item-title {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    .item-price { font-size: 12px; font-weight: 500; color: var(--text); }
    .item-price.none { color: var(--text-dim); }

    .status-pill {
      display: inline-block;
      padding: 2px 7px;
      font-size: 9px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      border: 1px solid;
      cursor: pointer;
      user-select: none;
    }

    .status-pill.open    { color: var(--text-dim); border-color: var(--border-mid); }
    .status-pill.bought  { color: var(--green); border-color: var(--green); background: var(--green-dim); }
    .status-pill.dropped { color: var(--text-dim); border-color: var(--border); opacity: 0.45; }

    .item-actions { display: flex; align-items: center; gap: 4px; }

    .launch-btn {
      background: transparent;
      border: 1px solid var(--border-mid);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 7px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s, color 0.1s, border-color 0.1s;
      white-space: nowrap;
    }

    .item-row:hover .launch-btn { opacity: 1; }
    .launch-btn:hover { color: var(--accent); border-color: var(--accent); }
    .launch-btn:disabled { cursor: default; opacity: 0 !important; }

    .remove-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1;
      padding: 3px 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s, color 0.1s;
    }

    .item-row:hover .remove-btn { opacity: 1; }
    .remove-btn:hover { color: #ff5555; }

    #empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 160px;
      color: var(--text-dim);
      font-size: 11px;
    }

    /* ─── MODAL ─── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #modal-overlay.hidden { display: none; }

    #modal {
      background: #141414;
      border: 1px solid var(--border-mid);
      padding: 24px;
      width: 400px;
      max-width: 90vw;
    }

    #modal h2 {
      font-family: var(--display);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 16px;
    }

    .form-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }

    .form-label {
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .form-input {
      background: var(--bg);
      border: 1px solid var(--border-mid);
      color: var(--text-bright);
      font-family: var(--mono);
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }

    .form-input:focus { border-color: var(--accent); }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .btn-submit {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      padding: 7px 16px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-submit:hover { opacity: 0.85; }

    .btn-cancel {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border-mid);
      font-family: var(--mono);
      font-size: 11px;
      padding: 7px 16px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .btn-cancel:hover { color: var(--text); border-color: var(--text-dim); }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #252525; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #333; }
  </style>
</head>
<body>

  <aside id="rail">
    <div id="rail-title">Projects</div>
    <div id="project-list"></div>
    <button id="new-project-btn">+ new project</button>
  </aside>

  <div id="content">
    <header id="topbar">
      <span id="active-project-label">—</span>
      <button class="topbar-btn" id="capture-btn">Save current page</button>
      <button class="topbar-btn primary" id="add-item-btn">+ Add item</button>
    </header>

    <div id="totals-strip">
      <div class="totals-cell">
        <span class="totals-label">Items</span>
        <span class="totals-value neutral" id="total-count">0</span>
      </div>
      <div class="totals-cell">
        <span class="totals-label">Open $</span>
        <span class="totals-value accent" id="total-open">$0</span>
      </div>
      <div class="totals-cell">
        <span class="totals-label">Bought $</span>
        <span class="totals-value green" id="total-bought">$0</span>
      </div>
      <div class="totals-cell">
        <span class="totals-label">Remaining</span>
        <span class="totals-value neutral" id="total-remaining">$0</span>
      </div>
    </div>

    <div id="item-header">
      <span class="col-label">Retailer</span>
      <span class="col-label">Title</span>
      <span class="col-label">Price</span>
      <span class="col-label">Status</span>
      <span class="col-label">Action</span>
    </div>

    <div id="item-list"></div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <h2>Add item</h2>
      <div class="form-field">
        <label class="form-label" for="f-title">Title</label>
        <input class="form-input" type="text" id="f-title" placeholder="Product name" autocomplete="off">
      </div>
      <div class="form-field">
        <label class="form-label" for="f-url">URL</label>
        <input class="form-input" type="url" id="f-url" placeholder="https://">
      </div>
      <div class="form-field">
        <label class="form-label" for="f-price">Price</label>
        <input class="form-input" type="number" id="f-price" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="form-field">
        <label class="form-label" for="f-notes">Notes</label>
        <input class="form-input" type="text" id="f-notes" placeholder="Optional">
      </div>
      <div class="form-actions">
        <button class="btn-cancel" id="modal-cancel">Cancel</button>
        <button class="btn-submit" id="modal-submit">Add item</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
