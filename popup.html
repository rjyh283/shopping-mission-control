<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0d0d;
      --border:      #1e1e1e;
      --border-mid:  #2a2a2a;
      --text:        #c8c8c8;
      --text-dim:    #6a6a6a;
      --text-bright: #e8e8e8;
      --accent:      #00ff88;
      --accent-dim:  rgba(0,255,136,0.08);
      --green:       #22c55e;
      --mono:        'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      --display:     'Barlow Condensed', 'Arial Narrow', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      width: 320px;
      min-height: 100px;
    }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 8px;
      border-bottom: 1px solid var(--border);
    }

    #header-title {
      font-family: var(--display);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    #open-dashboard {
      font-size: 10px;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--mono);
      transition: color 0.15s;
      padding: 0;
    }

    #open-dashboard:hover { color: var(--accent); }

    #body { padding: 12px 14px; }

    /* Page preview */
    #page-preview {
      background: #111;
      border: 1px solid var(--border-mid);
      padding: 8px 10px;
      margin-bottom: 12px;
    }

    #preview-title {
      font-size: 11px;
      color: var(--text-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    #preview-meta {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #preview-retailer {
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      border: 1px solid var(--border-mid);
      padding: 1px 5px;
    }

    #preview-price {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    #no-price { color: var(--text-dim); font-size: 10px; }

    /* Price drift */
    #drift-section {
      background: #0f0f0f;
      border: 1px solid var(--border-mid);
      border-top: none;
      padding: 7px 10px;
      margin-top: -12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #drift-label { font-size: 11px; flex: 1; line-height: 1.4; }
    .drift-was   { font-size: 10px; color: var(--text-dim); margin-left: 4px; }

    #update-price-btn {
      background: transparent;
      border: 1px solid var(--border-mid);
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 7px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
    }

    #update-price-btn:hover { color: var(--accent); border-color: var(--accent); }

    #loading-msg, #error-msg {
      font-size: 11px;
      color: var(--text-dim);
      padding: 12px 0;
      text-align: center;
    }

    #error-msg { color: #ff5555; }

    /* Form fields */
    .field { margin-bottom: 10px; }

    .field-label {
      font-size: 9px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 3px;
    }

    .field-input, .field-select {
      width: 100%;
      background: #111;
      border: 1px solid var(--border-mid);
      color: var(--text-bright);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field-input:focus, .field-select:focus { border-color: var(--accent); }

    .field-select option { background: #111; }

    /* Actions */
    #actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    #save-btn {
      flex: 1;
      background: var(--accent);
      color: #000;
      border: none;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      padding: 7px 0;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #save-btn:hover { opacity: 0.85; }
    #save-btn:disabled { opacity: 0.4; cursor: default; }

    #saved-msg {
      text-align: center;
      font-size: 11px;
      color: var(--green);
      padding: 6px 0 0;
      min-height: 20px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; }
  </style>
</head>
<body>
  <div id="header">
    <span id="header-title">Mission Control</span>
    <button id="open-dashboard">Open dashboard ↗</button>
  </div>

  <div id="body">
    <div id="loading-msg">Extracting page data…</div>
    <div id="error-msg" style="display:none"></div>

    <div id="main-content" style="display:none">
      <div id="page-preview">
        <div id="preview-title">—</div>
        <div id="preview-meta">
          <span id="preview-retailer">—</span>
          <span id="preview-price"></span>
        </div>
      </div>

      <div id="drift-section" style="display:none">
        <span id="drift-label"></span>
        <button id="update-price-btn">Update →</button>
      </div>

      <div class="field">
        <label class="field-label" for="f-project">Save to project</label>
        <select class="field-select" id="f-project"></select>
      </div>

      <div class="field">
        <label class="field-label" for="f-notes">Notes</label>
        <input class="field-input" type="text" id="f-notes" placeholder="Optional">
      </div>

      <div id="actions">
        <button id="save-btn">Save item</button>
      </div>
      <div id="saved-msg"></div>
    </div>
  </div>

  <script type="module" src="src/popup.js"></script>
</body>
</html>
